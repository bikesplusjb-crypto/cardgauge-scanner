<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow,noarchive"/>
<title>CardGauge — Instruments</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0a0e1a; --surface:#111827; --surface2:#1a2235;
  --border:#1e2d45; --border2:#2a3a55;
  --text:#f1f5f9; --text2:#94a3b8; --text3:#64748b;
  --green:#22c55e; --red:#ef4444; --blue:#3b82f6;
  --gold:#f59e0b; --gold-warm:#fbbf24;
  --f:'Inter',sans-serif; --fm:'JetBrains Mono',monospace; --fbig:'Anton',sans-serif;
  --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;min-width:0;}
html,body{overflow-x:hidden;}
body{
  background:var(--bg);color:var(--text);font-family:var(--f);
  padding:20px 16px 60px;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:940px;margin:0 auto;}

/* ── masthead ─────────────────────────────────────────────── */
.mast{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:22px;flex-wrap:wrap;}
.mast h1{font-family:var(--fbig);font-size:26px;letter-spacing:.5px;font-weight:400;}
.mast h1 span{color:var(--gold);}
.stamp{font-family:var(--fm);font-size:10.5px;color:var(--text3);letter-spacing:.06em;}

/* ── the 24h reading ──────────────────────────────────────── */
.hero{border:1px solid var(--border2);border-radius:var(--radius);
  background:linear-gradient(160deg,rgba(245,158,11,.09),rgba(245,158,11,.01));
  padding:22px;margin-bottom:16px;}
.hero-lbl{font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--gold);margin-bottom:6px;}
.hero-n{font-family:var(--fbig);font-size:clamp(52px,15vw,82px);line-height:.92;font-weight:400;}
.hero-unit{font-family:var(--f);font-size:14px;color:var(--text2);margin-top:8px;}
.hero-cmp{font-family:var(--fm);font-size:11.5px;color:var(--text3);margin-top:10px;}
.hero-cmp b{color:var(--text2);font-weight:600;}
/* The scan/search split. Which way people come in decides what to
   build next — heavy search means desktop, and desktop has no camera. */
.hero-split{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--border);font-family:var(--fm);font-size:11px;color:var(--text3);}
.hero-split b{color:var(--text2);font-weight:600;}

/* ── bars ─────────────────────────────────────────────────── */
.card{border:1px solid var(--border);border-radius:var(--radius);
  background:var(--surface);padding:18px;margin-bottom:16px;}
.card h2{font-family:var(--fm);font-size:10.5px;letter-spacing:1.6px;
  text-transform:uppercase;color:var(--text2);margin-bottom:14px;font-weight:600;}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px;}
.bar{flex:1;min-width:0;border-radius:2px 2px 0 0;position:relative;min-height:2px;
  display:flex;flex-direction:column;justify-content:flex-end;}
.bar i{display:block;width:100%;}
/* Two segments per day: photo scans below, typed searches above.
   One flat bar hid the fact that nearly half of all lookups never
   touch the camera. */
.bar .seg-scan{background:var(--gold);}
.bar .seg-search{background:var(--blue);opacity:.75;}
.bar.today .seg-scan{background:var(--gold-warm);}
.bar:hover .tip{opacity:1;}
.tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:var(--surface2);border:1px solid var(--border2);border-radius:6px;
  padding:5px 8px;font-family:var(--fm);font-size:10.5px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .12s;z-index:5;}
.axis{display:flex;justify-content:space-between;font-family:var(--fm);
  font-size:10px;color:var(--text3);margin-top:8px;}

/* ── stat grid ────────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;
  background:var(--border);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;margin-bottom:16px;}
.cell{background:var(--surface);padding:15px;}
.cell-lbl{font-family:var(--fm);font-size:9.5px;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--text3);margin-bottom:7px;}
.cell-n{font-family:var(--fbig);font-size:28px;line-height:1;font-weight:400;}
.cell-sub{font-family:var(--fm);font-size:10.5px;color:var(--text3);margin-top:6px;}

/* ── tables ───────────────────────────────────────────────── */
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:700px){.two{grid-template-columns:1fr;}}
table{width:100%;border-collapse:collapse;table-layout:fixed;}
td{padding:7px 0;font-size:13px;border-bottom:1px solid var(--border);
  overflow-wrap:anywhere;vertical-align:top;}
tr:last-child td{border-bottom:none;}
td.n{text-align:right;font-family:var(--fm);font-size:12.5px;
  color:var(--gold-warm);width:58px;font-weight:600;}
.empty{font-family:var(--fm);font-size:11.5px;color:var(--text3);padding:6px 0;}
/* How a card was looked up, next to how often. A card that is only
   ever typed is a card nobody has in their hand. */
.how{font-family:var(--fm);font-size:9.5px;color:var(--text3);display:block;margin-top:3px;}

/* ── the trust step ────────────────────────────────────────
   Scanning is free and sells nothing directly. Its job is to be so
   obviously honest that the paid half becomes believable. This is the
   number that says whether that works. */
.trust{border:1px solid var(--border2);border-radius:var(--radius);
  background:linear-gradient(160deg,rgba(34,197,94,.08),rgba(17,24,39,.4));
  padding:20px;margin-bottom:16px;}
.trust.cold{background:linear-gradient(160deg,rgba(239,68,68,.06),rgba(17,24,39,.4));}
.trust-k{font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--text3);margin-bottom:7px;}
.trust-n{font-family:var(--fbig);font-size:clamp(38px,11vw,56px);line-height:.96;}
.trust-n.warm{color:var(--green);} .trust-n.cool{color:var(--gold-warm);} .trust-n.cold{color:var(--red);}
.trust-of{font-family:var(--fm);font-size:12px;color:var(--text2);margin-top:9px;line-height:1.7;}
.trust-of b{color:var(--text);}
.subhead{font-family:var(--fm);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--text3);margin:16px 0 6px;padding-top:12px;border-top:1px solid var(--border);}
.trust-read{font-size:13px;color:var(--text2);line-height:1.6;margin-top:13px;
  padding-top:13px;border-top:1px solid var(--border);}
.trust-read b{color:var(--text);}
.srcbar{display:flex;height:9px;border-radius:100px;overflow:hidden;
  background:var(--surface2);margin:14px 0 10px;}
.srcbar i{display:block;}

/* Owner testing is still inside every scan_events number, because that
   table carries no user id. Said out loud rather than left for somebody
   to rediscover in three weeks. */
.aff{margin-top:16px;}
.aff-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.aff-row:last-child{border-bottom:none;}
.aff-row b{font-family:var(--fm);font-size:12.5px;color:var(--gold-warm);font-weight:600;}
.aff-row.own{color:var(--green);}
.aff-row.own b{color:var(--green);}
.aff-note{font-family:var(--fm);font-size:10.5px;line-height:1.7;color:var(--text3);
  margin-top:11px;padding-top:11px;border-top:1px solid var(--border);}
.aff-note b{color:var(--text2);}
.funnel{margin-top:14px;}
.fstep{display:flex;align-items:baseline;gap:12px;padding:9px 0;
  border-bottom:1px solid var(--border);}
.fstep:last-child{border-bottom:none;}
.fstep-k{flex:1;font-size:13px;color:var(--text2);}
.fstep-n{font-family:var(--fbig);font-size:20px;color:var(--text);line-height:1;min-width:44px;
  text-align:right;}
.fstep-r{font-family:var(--fm);font-size:10px;color:var(--text3);min-width:56px;text-align:right;}
.fstep.paid .fstep-n{color:var(--green);}
.fstep.paid .fstep-k{color:var(--text);font-weight:700;}
.fsrc{display:flex;justify-content:space-between;gap:12px;padding:6px 0;
  font-family:var(--fm);font-size:11px;color:var(--text3);}
.fsrc b{color:var(--gold-warm);font-weight:600;}
.fnote{font-family:var(--fm);font-size:10.5px;line-height:1.7;color:var(--text3);
  margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.fnote b{color:var(--text2);}
.fnote.bad{color:var(--gold-warm);}
.caveat{font-family:var(--fm);font-size:10.5px;line-height:1.6;color:var(--gold-warm);
  background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.22);
  border-radius:9px;padding:10px 12px;margin-top:13px;}

/* ── coverage meter ───────────────────────────────────────── */
.meter{height:9px;border-radius:100px;background:var(--surface2);
  overflow:hidden;display:flex;margin:4px 0 12px;}
.meter i{display:block;height:100%;}
.meter .has{background:var(--green);}
.meter .none{background:var(--border2);}
.legend{display:flex;gap:16px;font-family:var(--fm);font-size:11px;color:var(--text2);flex-wrap:wrap;}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;}
.verdict{font-size:13px;color:var(--text2);line-height:1.55;margin-top:12px;
  padding-top:12px;border-top:1px solid var(--border);}
.verdict b{color:var(--text);}

/* ── gate + states ────────────────────────────────────────── */
.gate{max-width:400px;margin:60px auto;text-align:center;}
.gate p{color:var(--text2);font-size:13.5px;margin:10px 0 18px;line-height:1.5;}
input{width:100%;background:var(--surface2);border:1px solid var(--border2);
  border-radius:10px;padding:13px;color:var(--text);font-family:var(--fm);
  font-size:14px;margin-bottom:10px;}
input:focus{outline:2px solid var(--gold);outline-offset:1px;}
button{width:100%;background:var(--gold);color:var(--bg);border:none;
  border-radius:10px;padding:13px;font-family:var(--f);font-weight:800;
  font-size:15px;cursor:pointer;}
button:hover{background:var(--gold-warm);}
.err{border:1px solid rgba(239,68,68,.4);background:rgba(239,68,68,.08);
  border-radius:10px;padding:14px;font-size:13.5px;color:#fca5a5;line-height:1.5;}
.loading{font-family:var(--fm);font-size:12px;color:var(--text3);padding:40px 0;text-align:center;}
.foot{font-family:var(--fm);font-size:10.5px;color:var(--text3);
  text-align:center;margin-top:26px;line-height:1.7;}
@media(prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">reading instruments…</div>
</div>

<script>
const SB_URL = 'https://nlaqvfplecacbbdbmhxd.supabase.co';
const SB_KEY = 'sb_publishable_9e5zQmOwtT6aJM1t-xSEyQ_jA2tDY5N';

const app = document.getElementById('app');
const esc = s => String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const num = n => Number(n||0).toLocaleString();

/* Every totals field the SQL may or may not have. Reading a missing key
   straight into num() prints 0, which is indistinguishable from a real
   zero — so an out-of-date function would silently report no traffic
   rather than saying it is out of date. */
function has(o, k){ return o && Object.prototype.hasOwnProperty.call(o, k); }

/* Token comes from the URL so the page can be bookmarked. It is kept
   out of any request that could be logged elsewhere — it only ever
   goes in the POST body to Supabase. */
function tokenFromUrl(){
  try { return new URLSearchParams(location.search).get('k') || ''; } catch(e){ return ''; }
}

function showGate(msg){
  app.innerHTML =
    '<div class="gate">'
    + '<div class="mast" style="justify-content:center;border:none;margin-bottom:0;">'
    +   '<h1>CARD<span>GAUGE</span></h1></div>'
    + '<p>' + (msg || 'Private instruments. Enter your access token.') + '</p>'
    + '<input id="tk" type="password" placeholder="access token" autocomplete="off"/>'
    + '<button id="go">Open</button>'
    + '</div>';
  const go = () => {
    const v = document.getElementById('tk').value.trim();
    if(v) location.search = '?k=' + encodeURIComponent(v);
  };
  document.getElementById('go').onclick = go;
  document.getElementById('tk').addEventListener('keydown', e => { if(e.key==='Enter') go(); });
  document.getElementById('tk').focus();
}

async function load(){
  const token = tokenFromUrl();
  if(!token){ showGate(); return; }

  let data;
  try{
    const r = await fetch(SB_URL + '/rest/v1/rpc/cg_stats', {
      method:'POST',
      headers:{ apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ p_token: token })
    });
    if(r.status === 404){
      app.innerHTML = '<div class="err">The <b>cg_stats</b> function does not exist yet. '
        + 'Run <b>trust_stats.sql</b> in the Supabase SQL editor first.</div>';
      return;
    }
    /* Read the body before deciding what went wrong. Every failure used
       to be reported as a bad token, which sent debugging in the wrong
       direction when the real cause was a missing grant. */
    let body = null;
    try { body = await r.json(); } catch(e){}

    if(!r.ok){
      const msg = (body && (body.message || body.hint || body.details)) || '';
      if(/not authorised/i.test(msg)){
        showGate('That token was rejected. Try again.');
      } else {
        app.innerHTML = '<div class="err"><b>Supabase returned ' + r.status + '.</b><br/>'
          + esc(msg || 'No message returned.')
          + '<br/><br/>If this mentions permission, run:<br/>'
          + '<span style="font-family:var(--fm);font-size:12px">'
          + 'grant execute on function public.cg_stats(text) to anon, authenticated;</span></div>';
      }
      return;
    }
    data = body;
  }catch(e){
    app.innerHTML = '<div class="err">Could not reach Supabase. '
      + 'Check the connection and reload.</div>';
    return;
  }
  render(data);
}

function render(d){
  const t     = d.totals   || {};
  const daily = d.daily    || [];
  const cov   = d.sold_coverage || {};

  /* An old cg_stats returns scans_* but no lookups_*. Rather than
     printing zeros that look like a dead week, say plainly that the
     SQL half of this pair has not been deployed. */
  if(!has(t, 'lookups_7d')){
    app.innerHTML = '<div class="err"><b>The database function is out of date.</b><br/>'
      + 'This page expects the Aug 10 <b>cg_stats</b>, which counts typed searches as well as '
      + 'photo scans. The version running still returns scans only, so every number here would '
      + 'be about half of the truth.<br/><br/>'
      + 'Run the updated <b>trust_stats.sql</b> in the Supabase SQL editor, then reload.</div>';
    return;
  }

  /* ── THE TRUST STEP ─────────────────────────────────────────
     A rate, not a count. "17 saved" means nothing on its own — 17 of
     20 is a working funnel and 17 of 400 is not, and only the second
     number tells you which.

     THE DENOMINATOR IS LOOKUPS, NOT SCANS. A card saved after a typed
     search still counts as a save — source='scanner' is set by the
     save path, not by how the card was found — so dividing by photo
     scans alone compared two different populations and overstated the
     rate by roughly the share of searches, which is currently 45%.

     Still not a clean conversion: one person can look up five cards
     and save one, and a save can land a day after the lookup. It is a
     direction of travel, and the reading below says so rather than
     dressing it up as precision. */
  const tr      = d.trust  || {};
  const bin     = d.binder || {};
  const saves   = Number(tr.saves_7d) || 0;
  const lookups = Number(t.lookups_7d) || 0;
  const rate    = lookups ? Math.round((saves / lookups) * 100) : null;
  const band    = rate === null ? '' : rate >= 30 ? 'warm' : rate >= 10 ? 'cool' : 'cold';

  let reading;
  if (!lookups) {
    reading = 'No lookups this week, so there is nothing to measure yet.';
  } else if (!saves) {
    reading = '<b>Nobody who looked up a card saved it.</b> They are getting a price and leaving. '
      + 'More traffic will not change that — whatever stops them happens after the number appears.';
  } else if (rate >= 30) {
    reading = '<b>People who look up a card keep it.</b> The tool is convincing them, so the '
      + 'constraint is how many people arrive, not what happens once they do.';
  } else if (rate >= 10) {
    reading = 'Some are keeping cards, most are not. Worth knowing whether the ones who leave never '
      + 'wanted a binder, or hit something in the way of getting one.';
  } else {
    reading = '<b>Almost nobody who looks up a card saves it.</b> They come for a number and go. '
      + 'That is the gap to close before spending anything on traffic.';
  }

  /* Where cards come from at all, so the scanner's share is visible
     against pasting and the other routes in. */
  const bySrc = bin.by_source || {};
  const srcTotal = Object.keys(bySrc).reduce(function(a,k){ return a + Number(bySrc[k]||0); }, 0);
  const srcCol = { scanner:'#22c55e', bulk:'#3b82f6', profit_tracker:'#a855f7', show_log:'#f59e0b' };
  const srcBar = srcTotal
    ? '<div class="srcbar">' + Object.keys(bySrc).map(function(k){
        return '<i style="width:' + ((bySrc[k]/srcTotal)*100) + '%;background:'
          + (srcCol[k] || '#2a3a55') + '"></i>'; }).join('') + '</div>'
      + '<div class="legend">' + Object.keys(bySrc).map(function(k){
        return '<span><i class="dot" style="background:' + (srcCol[k] || '#2a3a55') + '"></i>'
          + esc(k.replace(/_/g,' ')) + ' ' + bySrc[k] + '</span>'; }).join('') + '</div>'
    : '';

  const trustBlock =
      '<div class="trust' + (band === 'cold' ? ' cold' : '') + '">'
    +   '<div class="trust-k">LOOKED UP, THEN KEPT IT · 7 DAYS</div>'
    +   '<div class="trust-n ' + band + '">' + (rate === null ? '—' : rate + '%') + '</div>'
    +   '<div class="trust-of"><b>' + num(saves) + '</b> card' + (saves === 1 ? '' : 's')
    +     ' saved from the scanner, against <b>' + num(lookups) + '</b> lookup' + (lookups === 1 ? '' : 's')
    +     ' (' + num(t.scans_7d) + ' scanned, ' + num(t.searches_7d) + ' typed)'
    +     '.<br/><b>' + num(tr.savers_7d) + '</b> different '
    +     (Number(tr.savers_7d) === 1 ? 'person' : 'people') + ' saved something.</div>'
    +   srcBar
    +   '<div class="trust-read">' + reading + '</div>'
    /* The caveat has to describe the state the data is actually in, and
       that state changed the day the owner flag shipped. Saying
       "your testing is still in here" after it stops being true is the
       same failure as saying the opposite before it was — a dashboard
       that describes itself wrongly is worse than one that says
       nothing, because you stop checking.

       So it reads the number rather than asserting a state. */
    +   ownerCaveat(t)
    + '</div>';

  /* Oldest → newest for the bar strip; the query returns newest first. */
  const days  = daily.slice().reverse();
  const peak  = Math.max(1, ...days.map(x => Number(x.lookups)||0));
  const today = days.length ? days[days.length-1].day : '';

  const bars = days.map(x => {
    const nS = Number(x.scans)||0, nQ = Number(x.searches)||0, nT = nS + nQ;
    const h  = Math.round((nT/peak)*100);
    /* Segment heights are shares of THIS bar, so the two always add to
       the bar's own height whatever the day's total. */
    const pS = nT ? (nS/nT)*100 : 0;
    return '<div class="bar' + (x.day===today?' today':'') + '" style="height:' + Math.max(h,2) + '%">'
      + '<span class="tip">' + esc(x.day) + ' · ' + num(nT) + ' lookups ('
      + num(nS) + ' scan / ' + num(nQ) + ' search)</span>'
      + '<i class="seg-search" style="height:' + (100-pS) + '%"></i>'
      + '<i class="seg-scan" style="height:' + pS + '%"></i>'
      + '</div>';
  }).join('');

  /* Most-looked-up rows carry a scan/search split now, so a card that
     is only ever typed is visible as such — nobody had that one in
     their hand. */
  const cardRows = (arr) => arr.length
    ? '<table>' + arr.map(x => {
        const s = Number(x.scans)||0, q = Number(x.searches)||0;
        const how = (s && q) ? (s + ' scanned · ' + q + ' typed')
                  : s ? (s + ' scanned') : (q + ' typed');
        return '<tr><td>' + esc(x.card) + '<span class="how">' + how + '</span></td>'
             + '<td class="n">' + num(x.n) + '</td></tr>';
      }).join('') + '</table>'
    : '<div class="empty">nothing in the last 30 days</div>';

  const rows = (arr, keyName) => arr.length
    ? '<table>' + arr.map(x =>
        '<tr><td>' + esc(x[keyName]) + '</td><td class="n">' + num(x.n) + '</td></tr>'
      ).join('') + '</table>'
    : '<div class="empty">nothing in the last 30 days</div>';

  /* Sold coverage. This is the number that answers whether the API
     plan is earning its keep — an empty result means the user saw
     asking prices only.

     The old copy here recommended trialling "the next tier" and named
     the 14-day Starter plan. That advice was for a plan already left
     behind: /api/cardapi-status now reports a 30-day lookback and a
     50,000 daily record limit. Telling yourself to buy something you
     own is how a dashboard loses your trust. */
  const q   = Number(cov.queries)||0;
  const has_= Number(cov.with_data)||0;
  const pct = q ? Math.round((has_/q)*100) : 0;
  let verdict;
  if(!q){
    verdict = 'No lookups cached under the current filter version yet. '
      + 'This fills in as cards get priced.';
  } else if(pct >= 70){
    verdict = '<b>' + pct + '% of lookups come back with real sold prices.</b> '
      + 'The 30-day window is doing its job \u2014 nothing to change here.';
  } else if(pct >= 40){
    verdict = '<b>' + pct + '% of lookups find sold prices.</b> '
      + 'Worth watching. If it slides toward a third, the gap is more likely the queries being '
      + 'too specific than the lookback being too short.';
  } else {
    verdict = '<b>Only ' + pct + '% of lookups find sold prices.</b> '
      + 'Most people are seeing asking prices alone. With a 30-day window already in place, '
      + 'that points at the search terms rather than the plan \u2014 check what those queries look like.';
  }

  app.innerHTML =
    '<div class="mast">'
    +  '<h1>CARD<span>GAUGE</span> INSTRUMENTS</h1>'
    +  '<div class="stamp">' + esc(String(d.generated_at||'').slice(0,16).replace('T',' ')) + ' UTC</div>'
    + '</div>'

    + '<div class="hero">'
    +  '<div class="hero-lbl">CARD LOOKUPS · LAST 24 HOURS</div>'
    +  '<div class="hero-n">' + num(t.lookups_24h) + '</div>'
    /* Sessions that actually looked something up, not sessions that
       loaded the page. The old line put lookups next to a headcount of
       everyone who arrived, which invited reading it as one lookup
       each — and made a good day look like a thin one. */
    +  '<div class="hero-unit">' + (has(t,'scanners_24h')
         ? ('from <b style="color:var(--text)">' + num(t.scanners_24h) + '</b> '
            + (Number(t.scanners_24h)===1?'session':'sessions') + ' \u00b7 '
            + num(t.people_24h) + ' were on the site')
         : ('from ' + num(t.people_24h) + ' ' + (Number(t.people_24h)===1?'session':'sessions'))) + '</div>'
    +  '<div class="hero-cmp">48 hours <b>' + num(t.lookups_48h) + '</b>'
    +    ' &nbsp;·&nbsp; 7 days <b>' + num(t.lookups_7d) + '</b>'
    +    ' &nbsp;·&nbsp; 30 days <b>' + num(t.lookups_30d) + '</b>'
    +    ' &nbsp;·&nbsp; all time <b>' + num(t.lookups_all) + '</b></div>'
    +  '<div class="hero-split">'
    +    '<span>7d photo scans <b>' + num(t.scans_7d) + '</b></span>'
    +    '<span>7d typed searches <b>' + num(t.searches_7d) + '</b></span>'
    +    '<span>' + (Number(t.lookups_7d)
            ? Math.round((Number(t.searches_7d)/Number(t.lookups_7d))*100) + '% typed'
            : '\u2014') + '</span>'
    +  '</div>'
    + '</div>'

    + trustBlock

    + '<div class="card">'
    +  '<h2>Lookups per day · 30 days</h2>'
    +  '<div class="bars">' + (bars || '') + '</div>'
    +  '<div class="axis"><span>' + esc(days.length?days[0].day:'') + '</span>'
    +    '<span>peak ' + num(peak) + '</span>'
    +    '<span>' + esc(today) + '</span></div>'
    +  '<div class="legend" style="margin-top:10px">'
    +    '<span><i class="dot" style="background:var(--gold)"></i>photo scan</span>'
    +    '<span><i class="dot" style="background:var(--blue);opacity:.75"></i>typed search</span>'
    +  '</div>'
    + '</div>'

    + '<div class="grid">'
    +  cell('People · 7d',  num(t.people_7d),  num(t.visits_7d) + ' visits')
    /* Sessions that did SOMETHING, against sessions that merely
       arrived. This is the number that says whether the page works;
       counting only photo scans put it at a third of the truth. */
    +  cell('Used it · 7d',
            (Number(t.people_7d) ? Math.round((Number(t.scanners_7d)/Number(t.people_7d))*100) + '%' : '\u2014'),
            num(t.scanners_7d) + ' of ' + num(t.people_7d) + ' sessions looked up a card')
    /* A share, not a bare count, and measured against SCANS rather
       than lookups — a typed search has no images, so it could never
       have used a back and would only dilute the rate. */
    +  cell('Both sides · 7d',
            (Number(t.scans_7d) ? Math.round((Number(t.backs_7d)/Number(t.scans_7d))*100) + '%' : '\u2014'),
            num(t.backs_7d) + ' of ' + num(t.scans_7d) + ' scans used the back')
    /* Sell-link taps, measured against LOOKUPS rather than visits. The
       sell block only exists on a result page, so the only people who
       could have tapped it are the ones who looked something up —
       dividing by all sessions would understate it by the bounce rate
       and make a working feature look dead.

       Expect a 0 here for a while. It is a series that starts now so it
       exists when there is enough traffic to read it, not a number to
       judge anything by yet. */
    /* Acted on it: kept the session, or went to list a card. Both are
       "somebody did something after seeing a price", which is the step
       this whole dashboard exists to measure — and at 113 lookups a
       week, splitting them into two tiles gives you two zeros instead
       of one signal. */
    +  cell('Acted on it · 7d',
            num(Number(t.bench_saves_7d||0) + Number(t.sell_clicks_7d||0)),
            (has(t,'bench_saves_7d')
              ? (num(t.bench_saves_7d) + ' kept a bench, ' + num(t.sell_clicks_7d) + ' went to sell')
              : num(t.sell_clicks_7d) + ' sell taps \u2014 bench not counted yet'))
    +  cell('Public counter', num(d.counter), 'shown on the scanner')
    + '</div>'

    + '<div class="two">'
    +  '<div class="card"><h2>Where they came from · 30d</h2>'
    +    rows(d.sources||[], 'source')
    /* Own-domain hits, kept but separated. Somebody moving from the
       scanner to the site is not a channel, and letting those outrank
       every real source made internal navigation look like acquisition. */
    +    ((d.internal||[]).length
          ? '<div class="subhead">Moving around the site</div>' + rows(d.internal, 'source')
          : '')
    + '</div>'
    +  '<div class="card"><h2>Most looked up · 30d</h2>'
    +    cardRows(d.cards||[]) + '</div>'
    + '</div>'

    + savePanel(d, t)

    + funnelPanel(d, t)

    + affPanel(d, t)

    + '<div class="card">'
    +  '<h2>Sold-price coverage · 30d</h2>'
    +  '<div class="meter">'
    +    '<i class="has" style="width:' + pct + '%"></i>'
    +    '<i class="none" style="width:' + (100-pct) + '%"></i>'
    +  '</div>'
    +  '<div class="legend">'
    +    '<span><i class="dot" style="background:var(--green)"></i>' + num(has_) + ' found sold data</span>'
    +    '<span><i class="dot" style="background:var(--border2)"></i>' + num(cov.empty) + ' asks only</span>'
    +  '</div>'
    +  '<div class="verdict">' + verdict + '</div>'
    + '</div>'

    + '<div class="foot">Private. Not linked from anywhere and excluded from search engines.<br/>'
    +  'Anyone with this URL can read these numbers.</div>';
}

/* Three honest states, chosen by what the data says rather than by
   what was true when this was written.

   owner_lookups_7d is only present once the updated cg_stats is
   deployed; an older function returns nothing for it, and the page
   should say so rather than silently implying the exclusion is on. */
function ownerCaveat(t){
  if(!has(t, 'owner_lookups_7d')){
    return '<div class="caveat">Saves exclude your own account. Lookups do not \u2014 '
      + 'your testing is still inside every number above the save line, so <b>the real rate '
      + 'is higher than this.</b></div>';
  }
  var n = Number(t.owner_lookups_7d) || 0;
  if(!n){
    return '<div class="caveat">Owner exclusion is live but nothing has been marked yet. '
      + 'Open the scanner once with <b>?owner=1</b> on the end, or these numbers still '
      + 'include your own testing.</div>';
  }
  return '<div class="caveat" style="color:var(--text3);background:transparent;'
    + 'border-color:var(--border)"><b style="color:var(--green)">\u2713</b> '
    + n + ' of your own lookup' + (n===1?'':'s') + ' excluded this week. '
    + 'Everything above is other people.</div>';
}

/* Placement names in the order they appear on a result page, so the
   list reads as a funnel rather than an alphabet. */
var AFF_LABEL = {
  shop_active: 'Shop this card on eBay',
  sold_verify: 'See the sold listings',
  sold_check:  'See what it SOLD for',
  open_search: 'Open this search on eBay',
  own_store:   'Your own eBay store',
  shop_amazon: 'Shop (Amazon)'
};
var AFF_ORDER = ['shop_active','sold_verify','sold_check','open_search','shop_amazon','own_store'];

/* The Pro funnel. Four steps that used to live in three systems: the
   wall was unmeasured, the click only reached TikTok, the payment only
   existed in Stripe. Shown as a ladder with the drop-off between rungs,
   because the RATE is the finding — a wall nobody reaches and a wall
   everybody bounces off need opposite fixes and look identical as raw
   counts. */
var WALL_LABEL = {
  bulk_full:     'Paste blocked \u2014 binder already full',
  bulk_overflow: 'Paste would overflow the free limit',
  add_card_btn:  'Add-a-card, already at the cap',
  add_card_full: '"+ Add a Card" while full',
  free_strip:    'Tapped the nudge strip',
  share_locked:  'Tried the locked share panel'
};

/* Saving, as a rate rather than a count. Two saves against 110 lookups
   was the number that prompted this, and on its own it says nothing:
   the missing figure was how many people were ever offered a save.

   Bench and single-card offers are shown apart because most sessions
   look up one card and never see a bench — which makes them different
   problems with different fixes. */
function savePanel(d, t){
  if(!has(t,'save_offers_30d')) return '';
  var offers = Number(t.save_offers_30d||0);
  var benches= Number(t.bench_shown_30d||0);
  var saves  = Number(t.bench_saves_30d||0);
  var shown  = offers + benches;

  if(!shown){
    return '<div class="card"><h2>Saving \u00b7 30d</h2>'
      + '<div class="empty">Nothing recorded yet. From here on, a low save count can be read '
      + 'against how many people were actually asked.</div></div>';
  }

  var pct = shown ? Math.round((saves/shown)*100) : 0;
  var read;
  if(benches < 5){
    read = '<b>Almost nobody reaches a second lookup</b>, so the bench barely gets shown. '
         + 'That is a different problem from people declining it \u2014 the fix is giving '
         + 'somebody a reason to price a second card, not changing the offer.';
  } else if(pct >= 10){
    read = 'The offer is landing when people see it. Worth showing it more often.';
  } else {
    read = '<b>People see the offer and decline it.</b> The offer itself is the problem, '
         + 'not how often it appears.';
  }

  return '<div class="card"><h2>Saving \u00b7 30d</h2>'
    + '<div class="funnel">'
      + '<div class="fstep"><div class="fstep-k">Offered on a single card</div>'
        + '<div class="fstep-n">'+num(offers)+'</div><div class="fstep-r"></div></div>'
      + '<div class="fstep"><div class="fstep-k">Saw a bench (2+ cards)</div>'
        + '<div class="fstep-n">'+num(benches)+'</div><div class="fstep-r"></div></div>'
      + '<div class="fstep paid"><div class="fstep-k">Kept their cards</div>'
        + '<div class="fstep-n">'+num(saves)+'</div><div class="fstep-r">'+pct+'%</div></div>'
    + '</div>'
    + '<div class="fnote">'+read+'</div></div>';
}

function funnelPanel(d, t){
  if(!has(t,'pro_walls_30d')) return '';

  var views  = Number(t.binder_views_30d||0);
  var walls  = Number(t.pro_walls_30d||0);
  var clicks = Number(t.pro_clicks_30d||0);
  var paid   = Number(t.pro_paid_30d||0);

  if(!views && !walls && !clicks && !paid){
    return '<div class="card"><h2>Pro funnel \u00b7 30d</h2>'
      + '<div class="empty">Nothing recorded yet. Tracking started when this shipped \u2014 '
      + 'from here on, a zero here means nobody reached the wall rather than nobody measured it.</div></div>';
  }

  var pct = function(n, of){ return of ? Math.round((n/of)*100)+'%' : '\u2014'; };
  var rows =
      '<div class="fstep"><div class="fstep-k">Opened their binder</div>'
        +'<div class="fstep-n">'+num(views)+'</div><div class="fstep-r"></div></div>'
    + '<div class="fstep"><div class="fstep-k">Hit the Pro wall</div>'
        +'<div class="fstep-n">'+num(walls)+'</div><div class="fstep-r">'+pct(walls,views)+'</div></div>'
    + '<div class="fstep"><div class="fstep-k">Clicked through to Pro</div>'
        +'<div class="fstep-n">'+num(clicks)+'</div><div class="fstep-r">'+pct(clicks,walls)+'</div></div>'
    + '<div class="fstep paid"><div class="fstep-k">Paid</div>'
        +'<div class="fstep-n">'+num(paid)+'</div><div class="fstep-r">'+pct(paid,clicks)+'</div></div>';

  var by = d.pro_wall_by_source || {};
  var src = Object.keys(by).sort(function(a,b){ return by[b]-by[a]; }).map(function(k){
    return '<div class="fsrc"><span>'+esc(WALL_LABEL[k]||k)+'</span><b>'+num(by[k])+'</b></div>';
  }).join('');

  /* The one number that invalidates the rest of the panel. */
  var fails = Number(t.pro_check_fails_30d||0);
  var note = fails
    ? '<div class="fnote bad">\u26a0 <b>'+fails+' Pro checks failed</b> and fell back to granting '
      + 'access. Pro status is unverifiable while that is happening \u2014 fix it before reading '
      + 'anything above as a conversion rate.</div>'
    : '<div class="fnote">Payment comes from the Stripe webhook, not from a click \u2014 '
      + 'it is the only step here that means money. '
      + (Number(t.pro_cancelled_30d) ? '<b>'+num(t.pro_cancelled_30d)+' cancelled</b> in the same window.' : '')
      + '</div>';

  return '<div class="card"><h2>Pro funnel \u00b7 30d</h2>'
    + '<div class="funnel">' + rows + '</div>'
    + (src ? '<div class="fnote" style="padding-top:12px">Where the wall was hit</div>' + src : '')
    + note + '</div>';
}

function affPanel(d, t){
  if(!has(t,'aff_clicks_30d')) return '';
  var by = d.aff_by_place || {};
  var total = Number(t.aff_clicks_30d || 0);

  if(!total){
    return '<div class="card"><h2>Affiliate clicks \u00b7 30d</h2>'
      + '<div class="empty">Nothing clicked yet. Tracking started when this shipped \u2014 '
      + 'from here on, a missing commission means nobody bought rather than nobody clicked.</div></div>';
  }

  var rows = AFF_ORDER.filter(function(k){ return by[k]; }).map(function(k){
    return '<div class="aff-row'+(k==='own_store'?' own':'')+'"><span>'
      + esc(AFF_LABEL[k]||k) + '</span><b>' + num(by[k]) + '</b></div>';
  }).join('');

  /* Anything the page sends that this list does not know about gets
     shown raw rather than dropped silently. */
  Object.keys(by).forEach(function(k){
    if(AFF_ORDER.indexOf(k) === -1)
      rows += '<div class="aff-row"><span>'+esc(k)+'</span><b>'+num(by[k])+'</b></div>';
  });

  var own = Number(t.own_store_clicks_7d || 0);
  return '<div class="card"><h2>Affiliate clicks \u00b7 30d</h2>'
    + '<div class="aff">' + rows + '</div>'
    + '<div class="aff-note">Clicks, not sales \u2014 whether any became a purchase only shows '
    + 'in eBay Partner Network and Amazon Associates. '
    + (own ? '<b>' + own + ' of this week\'s went to your own store</b>, where EPN also credits '
           + 'the final value fee on anything that sells.'
          : 'Clicks to <b>your own store</b> are worth more than the rest \u2014 EPN credits the '
           + 'final value fee on those sales too.')
    + '</div></div>';
}

function cell(label, n, sub){
  return '<div class="cell"><div class="cell-lbl">' + esc(label) + '</div>'
    + '<div class="cell-n">' + n + '</div>'
    + '<div class="cell-sub">' + esc(sub) + '</div></div>';
}

load();
</script>
</body>
</html>
