<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow,noarchive"/>
<title>CardGauge — Instruments</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0a0e1a; --surface:#111827; --surface2:#1a2235;
  --border:#1e2d45; --border2:#2a3a55;
  --text:#f1f5f9; --text2:#94a3b8; --text3:#64748b;
  --green:#22c55e; --red:#ef4444; --blue:#3b82f6;
  --gold:#f59e0b; --gold-warm:#fbbf24;
  --f:'Inter',sans-serif; --fm:'JetBrains Mono',monospace; --fbig:'Anton',sans-serif;
  --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;min-width:0;}
html,body{overflow-x:hidden;}
body{
  background:var(--bg);color:var(--text);font-family:var(--f);
  padding:20px 16px 60px;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:940px;margin:0 auto;}

.mast{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:22px;flex-wrap:wrap;}
.mast h1{font-family:var(--fbig);font-size:26px;letter-spacing:.5px;font-weight:400;}
.mast h1 span{color:var(--gold);}
.stamp{font-family:var(--fm);font-size:10.5px;color:var(--text3);letter-spacing:.06em;}

.hero{border:1px solid var(--border2);border-radius:var(--radius);
  background:linear-gradient(160deg,rgba(245,158,11,.09),rgba(245,158,11,.01));
  padding:22px;margin-bottom:16px;}
.hero-lbl{font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--gold);margin-bottom:6px;}
.hero-n{font-family:var(--fbig);font-size:clamp(52px,15vw,82px);line-height:.92;font-weight:400;}
.hero-unit{font-family:var(--f);font-size:14px;color:var(--text2);margin-top:8px;}
.hero-cmp{font-family:var(--fm);font-size:11.5px;color:var(--text3);margin-top:10px;}
.hero-cmp b{color:var(--text2);font-weight:600;}
.hero-split{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--border);font-family:var(--fm);font-size:11px;color:var(--text3);}
.hero-split b{color:var(--text2);font-weight:600;}

.card{border:1px solid var(--border);border-radius:var(--radius);
  background:var(--surface);padding:18px;margin-bottom:16px;}
.card h2{font-family:var(--fm);font-size:10.5px;letter-spacing:1.6px;
  text-transform:uppercase;color:var(--text2);margin-bottom:14px;font-weight:600;}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px;}
.bar{flex:1;min-width:0;border-radius:2px 2px 0 0;position:relative;min-height:2px;
  display:flex;flex-direction:column;justify-content:flex-end;}
.bar i{display:block;width:100%;}
.bar .seg-scan{background:var(--gold);}
.bar .seg-search{background:var(--blue);opacity:.75;}
.bar.today .seg-scan{background:var(--gold-warm);}
.bar:hover .tip{opacity:1;}
.tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:var(--surface2);border:1px solid var(--border2);border-radius:6px;
  padding:5px 8px;font-family:var(--fm);font-size:10.5px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .12s;z-index:5;}
.axis{display:flex;justify-content:space-between;font-family:var(--fm);
  font-size:10px;color:var(--text3);margin-top:8px;}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;
  background:var(--border);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;margin-bottom:16px;}
.cell{background:var(--surface);padding:15px;}
.cell-lbl{font-family:var(--fm);font-size:9.5px;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--text3);margin-bottom:7px;}
.cell-n{font-family:var(--fbig);font-size:28px;line-height:1;font-weight:400;}
.cell-sub{font-family:var(--fm);font-size:10.5px;color:var(--text3);margin-top:6px;}

.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:700px){.two{grid-template-columns:1fr;}}
table{width:100%;border-collapse:collapse;table-layout:fixed;}
td{padding:7px 0;font-size:13px;border-bottom:1px solid var(--border);
  overflow-wrap:anywhere;vertical-align:top;}
tr:last-child td{border-bottom:none;}
td.n{text-align:right;font-family:var(--fm);font-size:12.5px;
  color:var(--gold-warm);width:58px;font-weight:600;}
.empty{font-family:var(--fm);font-size:11.5px;color:var(--text3);padding:6px 0;}
.how{font-family:var(--fm);font-size:9.5px;color:var(--text3);display:block;margin-top:3px;}

.trust{border:1px solid var(--border2);border-radius:var(--radius);
  background:linear-gradient(160deg,rgba(34,197,94,.08),rgba(17,24,39,.4));
  padding:20px;margin-bottom:16px;}
.trust.cold{background:linear-gradient(160deg,rgba(239,68,68,.06),rgba(17,24,39,.4));}
.trust-k{font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--text3);margin-bottom:7px;}
.trust-n{font-family:var(--fbig);font-size:clamp(38px,11vw,56px);line-height:.96;}
.trust-n.warm{color:var(--green);} .trust-n.cool{color:var(--gold-warm);} .trust-n.cold{color:var(--red);}
.trust-of{font-family:var(--fm);font-size:12px;color:var(--text2);margin-top:9px;line-height:1.7;}
.trust-of b{color:var(--text);}
.subhead{font-family:var(--fm);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--text3);margin:16px 0 6px;padding-top:12px;border-top:1px solid var(--border);}
.trust-read{font-size:13px;color:var(--text2);line-height:1.6;margin-top:13px;
  padding-top:13px;border-top:1px solid var(--border);}
.trust-read b{color:var(--text);}
.srcbar{display:flex;height:9px;border-radius:100px;overflow:hidden;
  background:var(--surface2);margin:14px 0 10px;}
.srcbar i{display:block;}

.aff{margin-top:16px;}
.aff-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.aff-row:last-child{border-bottom:none;}
.aff-row b{font-family:var(--fm);font-size:12.5px;color:var(--gold-warm);font-weight:600;}
.aff-row.own{color:var(--green);}
.aff-row.own b{color:var(--green);}
.aff-note{font-family:var(--fm);font-size:10.5px;line-height:1.7;color:var(--text3);
  margin-top:11px;padding-top:11px;border-top:1px solid var(--border);}
.aff-note b{color:var(--text2);}
.funnel{margin-top:14px;}
.fstep{display:flex;align-items:baseline;gap:12px;padding:9px 0;
  border-bottom:1px solid var(--border);}
.fstep:last-child{border-bottom:none;}
.fstep-k{flex:1;font-size:13px;color:var(--text2);}
.fstep-n{font-family:var(--fbig);font-size:20px;color:var(--text);line-height:1;min-width:44px;
  text-align:right;}
.fstep-r{font-family:var(--fm);font-size:10px;color:var(--text3);min-width:56px;text-align:right;}
.fstep.paid .fstep-n{color:var(--green);}
.fstep.paid .fstep-k{color:var(--text);font-weight:700;}
.fstep.bad .fstep-n{color:var(--red);}
.fsrc{display:flex;justify-content:space-between;gap:12px;padding:6px 0;
  font-family:var(--fm);font-size:11px;color:var(--text3);}
.fsrc b{color:var(--gold-warm);font-weight:600;}
.fnote{font-family:var(--fm);font-size:10.5px;line-height:1.7;color:var(--text3);
  margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.fnote b{color:var(--text2);}
.fnote.bad{color:var(--gold-warm);}
.caveat{font-family:var(--fm);font-size:10.5px;line-height:1.6;color:var(--gold-warm);
  background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.22);
  border-radius:9px;padding:10px 12px;margin-top:13px;}

.meter{height:9px;border-radius:100px;background:var(--surface2);
  overflow:hidden;display:flex;margin:4px 0 12px;}
.meter i{display:block;height:100%;}
.meter .has{background:var(--green);}
.meter .none{background:var(--border2);}
.legend{display:flex;gap:16px;font-family:var(--fm);font-size:11px;color:var(--text2);flex-wrap:wrap;}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;}
.verdict{font-size:13px;color:var(--text2);line-height:1.55;margin-top:12px;
  padding-top:12px;border-top:1px solid var(--border);}
.verdict b{color:var(--text);}

.eo-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.eo-row:last-child{border-bottom:none;}
.eo-recipient{color:var(--text2);overflow-wrap:anywhere;}
.eo-status{font-family:var(--fm);font-size:11px;flex-shrink:0;text-align:right;}
.eo-status.opened{color:var(--green);}
.eo-status.unopened{color:var(--text3);}

/* Business beta — same vocabulary as the rest of the page, one new
   row type for the per-shop roster. */
.biz-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.biz-row:last-child{border-bottom:none;}
.biz-row .biz-name{color:var(--text);font-weight:600;overflow-wrap:anywhere;}
.biz-row .biz-meta{font-family:var(--fm);font-size:10.5px;color:var(--text3);
  flex-shrink:0;text-align:right;}
.biz-row.stale .biz-name{color:var(--text3);}

.gate{max-width:400px;margin:60px auto;text-align:center;}
.gate p{color:var(--text2);font-size:13.5px;margin:10px 0 18px;line-height:1.5;}
input{width:100%;background:var(--surface2);border:1px solid var(--border2);
  border-radius:10px;padding:13px;color:var(--text);font-family:var(--fm);
  font-size:14px;margin-bottom:10px;}
input:focus{outline:2px solid var(--gold);outline-offset:1px;}
button{width:100%;background:var(--gold);color:var(--bg);border:none;
  border-radius:10px;padding:13px;font-family:var(--f);font-weight:800;
  font-size:15px;cursor:pointer;}
button:hover{background:var(--gold-warm);}
.err{border:1px solid rgba(239,68,68,.4);background:rgba(239,68,68,.08);
  border-radius:10px;padding:14px;font-size:13.5px;color:#fca5a5;line-height:1.5;}
.loading{font-family:var(--fm);font-size:12px;color:var(--text3);padding:40px 0;text-align:center;}
.foot{font-family:var(--fm);font-size:10.5px;color:var(--text3);
  text-align:center;margin-top:26px;line-height:1.7;}
@media(prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">reading instruments…</div>
</div>

<script>
const SB_URL = 'https://nlaqvfplecacbbdbmhxd.supabase.co';
const SB_KEY = 'sb_publishable_9e5zQmOwtT6aJM1t-xSEyQ_jA2tDY5N';

const app = document.getElementById('app');
const esc = s => String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const num = n => Number(n||0).toLocaleString();
const money = n => '$' + Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});

function has(o, k){ return o && Object.prototype.hasOwnProperty.call(o, k); }

function tokenFromUrl(){
  try { return new URLSearchParams(location.search).get('k') || ''; } catch(e){ return ''; }
}

function showGate(msg){
  app.innerHTML =
    '<div class="gate">'
    + '<div class="mast" style="justify-content:center;border:none;margin-bottom:0;">'
    +   '<h1>CARD<span>GAUGE</span></h1></div>'
    + '<p>' + (msg || 'Private instruments. Enter your access token.') + '</p>'
    + '<input id="tk" type="password" placeholder="access token" autocomplete="off"/>'
    + '<button id="go">Open</button>'
    + '</div>';
  const go = () => {
    const v = document.getElementById('tk').value.trim();
    if(v) location.search = '?k=' + encodeURIComponent(v);
  };
  document.getElementById('go').onclick = go;
  document.getElementById('tk').addEventListener('keydown', e => { if(e.key==='Enter') go(); });
  document.getElementById('tk').focus();
}

async function load(){
  const token = tokenFromUrl();
  if(!token){ showGate(); return; }

  let data;
  try{
    const r = await fetch(SB_URL + '/rest/v1/rpc/cg_stats', {
      method:'POST',
      headers:{ apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ p_token: token })
    });
    if(r.status === 404){
      app.innerHTML = '<div class="err">The <b>cg_stats</b> function does not exist yet. '
        + 'Run <b>trust_stats.sql</b> in the Supabase SQL editor first.</div>';
      return;
    }
    let body = null;
    try { body = await r.json(); } catch(e){}

    if(!r.ok){
      const msg = (body && (body.message || body.hint || body.details)) || '';
      if(/not authorised/i.test(msg)){
        showGate('That token was rejected. Try again.');
      } else {
        app.innerHTML = '<div class="err"><b>Supabase returned ' + r.status + '.</b><br/>'
          + esc(msg || 'No message returned.')
          + '<br/><br/>If this mentions permission, run:<br/>'
          + '<span style="font-family:var(--fm);font-size:12px">'
          + 'grant execute on function public.cg_stats(text) to anon, authenticated;</span></div>';
      }
      return;
    }
    data = body;
  }catch(e){
    app.innerHTML = '<div class="err">Could not reach Supabase. '
      + 'Check the connection and reload.</div>';
    return;
  }

  /* Business stats come from a SECOND function, fetched separately and
     deliberately allowed to fail.

     cg_business_stats was added after this page existed. If it is
     missing, out of date, or throws, the whole rest of the dashboard
     must still render — a panel that did not ship yet is not a reason
     to lose the traffic numbers. On any failure biz stays null and
     businessPanel() returns nothing at all. */
  let biz = null;
  try{
    const rb = await fetch(SB_URL + '/rest/v1/rpc/cg_business_stats', {
      method:'POST',
      headers:{ apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ p_token: token })
    });
    if(rb.ok) biz = await rb.json();
  }catch(e){ /* left null on purpose — see above */ }

  render(data, biz);
}

function render(d, biz){
  const t     = d.totals   || {};
  const daily = d.daily    || [];
  const cov   = d.sold_coverage || {};

  if(!has(t, 'lookups_7d')){
    app.innerHTML = '<div class="err"><b>The database function is out of date.</b><br/>'
      + 'This page expects the Aug 10 <b>cg_stats</b>, which counts typed searches as well as '
      + 'photo scans. The version running still returns scans only, so every number here would '
      + 'be about half of the truth.<br/><br/>'
      + 'Run the updated <b>trust_stats.sql</b> in the Supabase SQL editor, then reload.</div>';
    return;
  }

  const tr      = d.trust  || {};
  const bin     = d.binder || {};
  const saves   = Number(tr.saves_7d) || 0;
  const lookups = Number(t.lookups_7d) || 0;
  const localN  = Number(tr.local_7d) || 0;
  const acctN   = Number(tr.account_7d) || 0;
  const rate    = lookups ? Math.round((saves / lookups) * 100) : null;
  const band    = rate === null ? '' : rate >= 30 ? 'warm' : rate >= 10 ? 'cool' : 'cold';

  /* SAVES NOW COME FROM EVENTS, NOT watchlist_items ROWS.

     The old count read the binder table, which only ever receives an
     ACCOUNT save. After the signup wall came out on 1 Sept the common
     path keeps a card in the browser and writes no row at all, so this
     panel reported 0% while ten saves were happening in the same week
     -- and asserted "nobody who looked up a card saved it" on top of
     a query that could not see them. */
  let reading;
  if (!lookups) {
    reading = 'No lookups this week, so there is nothing to measure yet.';
  } else if (!saves) {
    reading = '<b>Nobody who looked up a card kept it this week.</b> Worth checking the save '
      + 'button works before reading anything into that \u2014 it was broken once already.';
  } else if (rate >= 30) {
    reading = '<b>People who look up a card keep it.</b> The tool is convincing them, so the '
      + 'constraint is how many people arrive, not what happens once they do.';
  } else if (rate >= 10) {
    reading = 'Some are keeping cards, most are not. Worth knowing whether the ones who leave never '
      + 'wanted a binder, or hit something in the way of getting one.';
  } else {
    reading = '<b>' + saves + ' saved against ' + lookups + ' lookups.</b> Low, but the save path '
      + 'was rebuilt on 1 Sept \u2014 this is measuring days, not months, so give it a week before '
      + 'reading a trend into it.';
  }
  if (saves) {
    reading += '<br/><b>' + localN + '</b> kept on the device, <b>' + acctN + '</b> to an account. '
      + (acctN ? 'Only the account ones survive a cleared browser.'
               : 'None have been signed up for yet, so none of them survive a cleared browser.');
  }

  const bySrc = bin.by_source || {};
  const srcTotal = Object.keys(bySrc).reduce(function(a,k){ return a + Number(bySrc[k]||0); }, 0);
  const srcCol = { scanner:'#22c55e', bulk:'#3b82f6', profit_tracker:'#a855f7', show_log:'#f59e0b' };
  const srcBar = srcTotal
    ? '<div class="srcbar">' + Object.keys(bySrc).map(function(k){
        return '<i style="width:' + ((bySrc[k]/srcTotal)*100) + '%;background:'
          + (srcCol[k] || '#2a3a55') + '"></i>'; }).join('') + '</div>'
      + '<div class="legend">' + Object.keys(bySrc).map(function(k){
        return '<span><i class="dot" style="background:' + (srcCol[k] || '#2a3a55') + '"></i>'
          + esc(k.replace(/_/g,' ')) + ' ' + bySrc[k] + '</span>'; }).join('') + '</div>'
    : '';

  const trustBlock =
      '<div class="trust' + (band === 'cold' ? ' cold' : '') + '">'
    +   '<div class="trust-k">LOOKED UP, THEN KEPT IT · 7 DAYS</div>'
    +   '<div class="trust-n ' + band + '">' + (rate === null ? '—' : rate + '%') + '</div>'
    +   '<div class="trust-of"><b>' + num(saves) + '</b> card' + (saves === 1 ? '' : 's')
    +     ' saved from the scanner, against <b>' + num(lookups) + '</b> lookup' + (lookups === 1 ? '' : 's')
    +     ' (' + num(t.scans_7d) + ' scanned, ' + num(t.searches_7d) + ' typed)'
    +     '.<br/><b>' + num(tr.savers_7d) + '</b> different '
    +     (Number(tr.savers_7d) === 1 ? 'person' : 'people') + ' saved something.</div>'
    +   srcBar
    +   '<div class="trust-read">' + reading + '</div>'
    +   ownerCaveat(t)
    + '</div>';

  const days  = daily.slice().reverse();
  const peak  = Math.max(1, ...days.map(x => Number(x.lookups)||0));
  const today = days.length ? days[days.length-1].day : '';

  const bars = days.map(x => {
    const nS = Number(x.scans)||0, nQ = Number(x.searches)||0, nT = nS + nQ;
    const h  = Math.round((nT/peak)*100);
    const pS = nT ? (nS/nT)*100 : 0;
    return '<div class="bar' + (x.day===today?' today':'') + '" style="height:' + Math.max(h,2) + '%">'
      + '<span class="tip">' + esc(x.day) + ' · ' + num(nT) + ' lookups ('
      + num(nS) + ' scan / ' + num(nQ) + ' search)</span>'
      + '<i class="seg-search" style="height:' + (100-pS) + '%"></i>'
      + '<i class="seg-scan" style="height:' + pS + '%"></i>'
      + '</div>';
  }).join('');

  const cardRows = (arr) => arr.length
    ? '<table>' + arr.map(x => {
        const s = Number(x.scans)||0, q = Number(x.searches)||0;
        const how = (s && q) ? (s + ' scanned · ' + q + ' typed')
                  : s ? (s + ' scanned') : (q + ' typed');
        return '<tr><td>' + esc(x.card) + '<span class="how">' + how + '</span></td>'
             + '<td class="n">' + num(x.n) + '</td></tr>';
      }).join('') + '</table>'
    : '<div class="empty">nothing in the last 30 days</div>';

  const rows = (arr, keyName) => arr.length
    ? '<table>' + arr.map(x =>
        '<tr><td>' + esc(x[keyName]) + '</td><td class="n">' + num(x.n) + '</td></tr>'
      ).join('') + '</table>'
    : '<div class="empty">nothing in the last 30 days</div>';

  const q   = Number(cov.queries)||0;
  const has_= Number(cov.with_data)||0;
  const pct = q ? Math.round((has_/q)*100) : 0;
  let verdict;
  if(!q){
    verdict = 'No lookups cached under the current filter version yet. '
      + 'This fills in as cards get priced.';
  } else if(pct >= 70){
    verdict = '<b>' + pct + '% of lookups come back with real sold prices.</b> '
      + 'The 30-day window is doing its job \u2014 nothing to change here.';
  } else if(q < 25){
    /* A VERSION BUMP EMPTIES THIS, AND AN EMPTY SET IS NOT A RESULT.

       SOLD_LOGIC_VERSION going up discards every cached row on purpose,
       so for a day afterwards this panel is reading three rows and
       calling it a coverage rate. On 2 Sept it printed "Only 0% of
       lookups find sold prices" a few hours after a bump -- alarming,
       and describing nothing.

       Below about 25 rows there is no rate to report, so it says that
       instead of dividing by a handful. */
    verdict = '<b>Only ' + q + ' cached lookup' + (q===1?'':'s') + ' under the current filter '
      + 'version.</b> A version bump clears the cache, so this fills back in over a day or so. '
      + 'Nothing to read from it until then.';
  } else if(pct >= 40){
    verdict = '<b>' + pct + '% of lookups find sold prices.</b> '
      + 'Worth watching. If it slides toward a third, the gap is more likely the queries being '
      + 'too specific than the lookback being too short.';
  } else {
    verdict = '<b>Only ' + pct + '% of lookups find sold prices.</b> '
      + 'Most people are seeing asking prices alone. With a 30-day window already in place, '
      + 'that points at the search terms rather than the plan \u2014 check what those queries look like.';
  }

  app.innerHTML =
    '<div class="mast">'
    +  '<h1>CARD<span>GAUGE</span> INSTRUMENTS</h1>'
    +  '<div class="stamp">' + esc(String(d.generated_at||'').slice(0,16).replace('T',' ')) + ' UTC</div>'
    + '</div>'

    + '<div class="hero">'
    +  '<div class="hero-lbl">CARD LOOKUPS · LAST 24 HOURS</div>'
    +  '<div class="hero-n">' + num(t.lookups_24h) + '</div>'
    +  '<div class="hero-unit">' + (has(t,'scanners_24h')
         ? ('from <b style="color:var(--text)">' + num(t.scanners_24h) + '</b> '
            + (Number(t.scanners_24h)===1?'session':'sessions') + ' \u00b7 '
            + num(t.people_24h) + ' were on the site')
         : ('from ' + num(t.people_24h) + ' ' + (Number(t.people_24h)===1?'session':'sessions'))) + '</div>'
    +  '<div class="hero-cmp">48 hours <b>' + num(t.lookups_48h) + '</b>'
    +    ' &nbsp;·&nbsp; 7 days <b>' + num(t.lookups_7d) + '</b>'
    +    ' &nbsp;·&nbsp; 30 days <b>' + num(t.lookups_30d) + '</b>'
    +    ' &nbsp;·&nbsp; all time <b>' + num(t.lookups_all) + '</b></div>'
    +  '<div class="hero-split">'
    +    '<span>7d photo scans <b>' + num(t.scans_7d) + '</b></span>'
    +    '<span>7d typed searches <b>' + num(t.searches_7d) + '</b></span>'
    +    '<span>' + (Number(t.lookups_7d)
            ? Math.round((Number(t.searches_7d)/Number(t.lookups_7d))*100) + '% typed'
            : '\u2014') + '</span>'
    +  '</div>'
    + '</div>'

    + trustBlock

    + '<div class="card">'
    +  '<h2>Lookups per day · 30 days</h2>'
    +  '<div class="bars">' + (bars || '') + '</div>'
    +  '<div class="axis"><span>' + esc(days.length?days[0].day:'') + '</span>'
    +    '<span>peak ' + num(peak) + '</span>'
    +    '<span>' + esc(today) + '</span></div>'
    +  '<div class="legend" style="margin-top:10px">'
    +    '<span><i class="dot" style="background:var(--gold)"></i>photo scan</span>'
    +    '<span><i class="dot" style="background:var(--blue);opacity:.75"></i>typed search</span>'
    +  '</div>'
    + '</div>'

    + '<div class="grid">'
    +  cell('People · 7d',  num(t.people_7d),  num(t.visits_7d) + ' visits')
    +  cell('Used it · 7d',
            (Number(t.people_7d) ? Math.round((Number(t.scanners_7d)/Number(t.people_7d))*100) + '%' : '\u2014'),
            num(t.scanners_7d) + ' of ' + num(t.people_7d) + ' sessions looked up a card')
    +  cell('Both sides · 7d',
            (Number(t.scans_7d) ? Math.round((Number(t.backs_7d)/Number(t.scans_7d))*100) + '%' : '\u2014'),
            num(t.backs_7d) + ' of ' + num(t.scans_7d) + ' scans used the back')
    +  cell('Acted on it · 7d',
            num(Number(t.bench_saves_7d||0) + Number(t.sell_clicks_7d||0)),
            (has(t,'bench_saves_7d')
              ? (num(t.bench_saves_7d) + ' kept a bench, ' + num(t.sell_clicks_7d) + ' went to sell')
              : num(t.sell_clicks_7d) + ' sell taps \u2014 bench not counted yet'))
    +  cell('Public counter', num(d.counter), 'shown on the scanner')
    + '</div>'

    + '<div class="two">'
    +  '<div class="card"><h2>Where they came from · 30d</h2>'
    +    rows(d.sources||[], 'source')
    +    ((d.internal||[]).length
          ? '<div class="subhead">Moving around the site</div>' + rows(d.internal, 'source')
          : '')
    + '</div>'
    +  '<div class="card"><h2>Most looked up · 30d</h2>'
    +    cardRows(d.cards||[]) + '</div>'
    + '</div>'

    + savePanel(d, t)

    + setPanel(d, t)

    + wallPanel(d)

    + funnelPanel(d, t)

    + refusalPanel(d)

    + businessPanel(biz)

    + affPanel(d, t)

    + emailOpensPanel(d, t)

    + '<div class="card">'
    +  '<h2>Sold-price coverage · 30d</h2>'
    +  '<div class="meter">'
    +    '<i class="has" style="width:' + pct + '%"></i>'
    +    '<i class="none" style="width:' + (100-pct) + '%"></i>'
    +  '</div>'
    +  '<div class="legend">'
    +    '<span><i class="dot" style="background:var(--green)"></i>' + num(has_) + ' found sold data</span>'
    +    '<span><i class="dot" style="background:var(--border2)"></i>' + num(cov.empty) + ' asks only</span>'
    +  '</div>'
    /* The version matters. cg_stats used to read a hard-coded @v2 while
       SOLD_LOGIC_VERSION had moved on, so this panel described a frozen
       set of rows from logic that no longer ran. It now follows whichever
       version is live -- and says which, so the number is never mistaken
       for a timeless one. */
    +  '<div class="verdict">' + verdict
    +    (cov.cache_version
          ? '<br/><span style="color:var(--text3);font-family:var(--fm);font-size:11px">'
            + 'Filter logic v' + esc(cov.cache_version) + '. A version bump clears the cache, so '
            + 'this reads low for a day afterwards while it refills.</span>'
          : '')
    +  '</div>'
    + '</div>'

    + '<div class="foot">Private. Not linked from anywhere and excluded from search engines.<br/>'
    +  'Anyone with this URL can read these numbers.</div>';
}

function ownerCaveat(t){

/* ── BUSINESS BETA ──────────────────────────────────────────────
   The shop-facing product, kept deliberately separate from the
   consumer numbers above: different users, different failure modes,
   and mixing them would hide both.

   Leads with IDENTIFIED, not volume. A shop can scan all day and
   still be getting nothing usable — a row with no year or a card
   number of "Unknown" cannot be looked up, relisted or matched to a
   break, and its price is a median for the player rather than the
   card. On 28 Aug that ran at 50%, and every failure traced back to
   a scan where the backs were skipped. Volume without that number is
   just activity.

   Everything here excludes the test shop, which is why zero is the
   correct reading until a real shop signs up rather than a sign that
   something is broken. */
function businessPanel(biz){
  if(!biz || !biz.totals) return '';
  var t = biz.totals;

  if(!Number(t.shops)){
    return '<div class="card"><h2>Business beta</h2>'
      + '<div class="empty">No beta shops yet. Your own test shop is excluded on purpose \u2014 '
      + 'on 28 Aug it alone produced 37 API calls, 15 cards and 4 sales, which would bury the '
      + 'first real shop completely.</div></div>';
  }

  var scanned = Number(t.scanned)||0;
  var ident   = Number(t.identified)||0;
  var cards   = Number(t.cards)||0;
  var flagged = Number(t.flagged)||0;
  var identPct = scanned ? Math.round((ident/scanned)*100) : null;
  var flagPct  = cards   ? Math.round((flagged/cards)*100) : null;

  var read;
  if(identPct === null){
    read = 'Nothing scanned into inventory yet, so there is no identification rate to read.';
  } else if(identPct >= 85){
    read = '<b>Cards are coming back properly identified.</b> Year and card number are landing, '
         + 'which means the prices attached to them are for the card rather than the player.';
  } else if(identPct >= 50){
    read = '<b>' + (scanned-ident) + ' of ' + scanned + ' scanned cards have no usable year or '
         + 'card number.</b> Those rows cannot be looked up or relisted, and their price is a '
         + 'median across everything that player has. Almost always a skipped back photo.';
  } else {
    read = '<b>Most scanned cards are not properly identified.</b> Prices on those rows are for '
         + 'the player, not the card \u2014 confident-looking and close to meaningless. Check '
         + 'whether backs are being captured at all.';
  }

  /* A warning that fires on nearly everything trains people to click
     past it, which is worse than no warning: the one card where it
     matters gets dismissed along with the rest. */
  var flagNote = '';
  if(flagPct !== null && cards >= 5){
    flagNote = flagPct >= 50
      ? '<div class="fnote bad">\u26a0 <b>' + flagPct + '% of saved cards carry a review flag.</b> '
        + 'At that rate the warning is decoration \u2014 shops will learn to click past it, '
        + 'including on the card where it matters.</div>'
      : '<div class="fnote"><b>' + flagPct + '%</b> of saved cards were flagged for review. '
        + 'Low enough that the flag still means something when it appears.</div>';
  }

  var basis = biz.basis || {};
  var bTot  = Object.keys(basis).reduce(function(a,k){ return a + Number(basis[k]||0); }, 0);
  var bCol  = { sold:'#22c55e', ask:'#f59e0b', limited:'#ef4444', mixed:'#3b82f6', none:'#2a3a55' };
  var basisBar = bTot
    ? '<div class="srcbar">' + Object.keys(basis).map(function(k){
        return '<i style="width:' + ((basis[k]/bTot)*100) + '%;background:'
             + (bCol[k]||'#2a3a55') + '"></i>'; }).join('') + '</div>'
      + '<div class="legend">' + Object.keys(basis).map(function(k){
        return '<span><i class="dot" style="background:' + (bCol[k]||'#2a3a55') + '"></i>'
             + esc(k) + ' ' + basis[k] + '</span>'; }).join('') + '</div>'
      + '<div class="fnote"><b>ask</b> means no completed sales were found and the number is a '
      + 'ceiling, not a value. A high ask share is a comp-data problem, which needs a different '
      + 'fix from bad identification.</div>'
    : '';

  var shops = (biz.shops||[]).map(function(s){
    var stale = false;
    try{
      stale = (Date.now() - new Date(s.last_activity).getTime()) > 7*24*3600*1000;
    }catch(e){}
    return '<div class="biz-row' + (stale?' stale':'') + '">'
      + '<span class="biz-name">' + esc(s.name) + '</span>'
      + '<span class="biz-meta">' + num(s.cards) + ' cards \u00b7 ' + num(s.sales) + ' sales \u00b7 '
      + num(s.breaks) + ' breaks \u00b7 ' + esc(s.last_activity) + '</span></div>';
  }).join('');

  /* Breaks read $0.00 when spot prices were never entered. That is a
     shop not filling the field in, not the tab being broken -- worth
     separating, because they look identical from the outside. */
  var brk = biz.breaks_detail || [];
  var brkEmpty = brk.filter(function(b){ return Number(b.spots) > 0 && !Number(b.spots_priced); }).length;
  var brkRows = brk.length
    ? brk.map(function(b){
        return '<div class="biz-row"><span class="biz-name">' + esc(b.name) + '</span>'
          + '<span class="biz-meta">' + num(b.spots_priced) + '/' + num(b.spots) + ' priced \u00b7 '
          + money(b.revenue) + '</span></div>'; }).join('')
      + (brkEmpty ? '<div class="fnote bad">\u26a0 <b>' + brkEmpty + ' break'
          + (brkEmpty===1?'':'s') + ' with spots but no prices entered.</b> Those read $0.00 on '
          + 'the shop dashboard, which looks broken to them even though it is not.</div>' : '')
    : '';

  var sales = (biz.sales_recent||[]).map(function(s){
    var gap = Number(s.ask_gap);
    return '<div class="biz-row"><span class="biz-name">' + esc(s.card_name) + '</span>'
      + '<span class="biz-meta">' + money(s.sale_price) + ' \u00b7 net ' + money(s.net_profit)
      + (isFinite(gap) && gap !== 0
          ? ' \u00b7 <span style="color:' + (gap < 0 ? 'var(--red)' : 'var(--green)') + '">'
            + (gap > 0 ? '+' : '') + money(gap) + ' vs ask</span>'
          : '')
      + '</span></div>';
  }).join('');

  return '<div class="card"><h2>Business beta</h2>'
    + '<div class="funnel">'
      + '<div class="fstep"><div class="fstep-k">Shops</div><div class="fstep-n">'
        + num(t.shops) + '</div><div class="fstep-r">' + num(t.staff) + ' staff</div></div>'
      + '<div class="fstep"><div class="fstep-k">Cards scanned into inventory</div>'
        + '<div class="fstep-n">' + num(scanned) + '</div>'
        + '<div class="fstep-r">' + num(t.manual) + ' manual</div></div>'
      + '<div class="fstep' + (identPct !== null && identPct < 50 ? ' bad' : ' paid')
        + '"><div class="fstep-k">Properly identified</div>'
        + '<div class="fstep-n">' + num(ident) + '</div>'
        + '<div class="fstep-r">' + (identPct === null ? '\u2014' : identPct + '%') + '</div></div>'
      + '<div class="fstep"><div class="fstep-k">Cost filled in</div>'
        + '<div class="fstep-n">' + num(t.cost_entered) + '</div>'
        + '<div class="fstep-r">of ' + num(cards) + '</div></div>'
      + '<div class="fstep paid"><div class="fstep-k">Sold through the sale form</div>'
        + '<div class="fstep-n">' + num(t.sales_30d) + '</div>'
        + '<div class="fstep-r">' + money(t.net_30d) + ' net</div></div>'
    + '</div>'
    + '<div class="fnote">' + read + '</div>'
    + flagNote
    + (basisBar ? '<div class="subhead">What the prices rest on</div>' + basisBar : '')
    + (shops    ? '<div class="subhead">Shops</div>' + shops : '')
    + (brkRows  ? '<div class="subhead">Breaks</div>' + brkRows : '')
    + (sales    ? '<div class="subhead">Recent sales</div>' + sales : '')
    + '<div class="fnote">Net profit is computed by Postgres from sale price, cost, fees and '
    + 'shipping \u2014 the app cannot write a wrong number into it. Everything else a shop sees '
    + 'on their own dashboard is an estimate off asking prices.</div>'
    + '</div>';
}

/* TWO THINGS WERE WRONG HERE.

   The verdict fired on `nomat > miss` -- comparing sets that failed to
   match against sets whose missing list was opened. Those are different
   denominators: nomatch is a lookup outcome, miss is a later funnel
   step. A catalog could match everything and still show few missing-list
   opens, and this would call it a failure.

   And the 30-day window spans the period when the Catalog add-on was
   CANCELLED and every lookup returned nothing. A failure rate read
   across that window describes an outage, not the catalog's coverage.
   cg_stats now returns since_fix counts starting at the 1 Sept renewal;
   those are the honest ones. */
function setPanel(d, t){
  if(!has(t,'set_missing_30d')) return '';
  var f     = d.features || {};
  var looks = Number(t.set_lookups_30d||0);
  var miss  = Number(t.set_missing_30d||0);
  var part  = Number(t.set_partial_30d||0);
  var nomat = Number(t.set_nomatch_30d||0);

  var fLooks = Number(f.set_lookups_since_fix||0);
  var fMiss  = Number(f.set_missing_since_fix||0);
  var fNo    = Number(f.set_nomatch_since_fix||0);

  if(!looks && !miss){
    return '<div class="card"><h2>Set builder \u00b7 30d</h2>'
      + '<div class="empty">Nobody has looked up a set. It\'s reachable only from a binder '
      + 'with saved cards, so this stays at zero until saves move.</div></div>';
  }

  /* Judged on the post-renewal window when there is enough of one, and
     against LOOKUPS rather than missing-list opens. Below a handful of
     lookups no rate means anything, so it says so instead. */
  /* set_lookup STOPPED BEING THE EVENT THAT FIRES.

     The restored "What am I missing?" button calls showMissing()
     directly and logs set_missing_viewed. set_lookup only fires on the
     "Look up the size" path, for a set with no total yet -- and it has
     not fired since 15 Aug. So a since-fix counter watching set_lookup
     alone printed "0 set lookups since the catalog was renewed" on a
     day when the missing list was opened twice and a 225-card
     checklist was built.

     Activity is either event. Judged on the sum, with the failure rate
     still measured against lookups, since that is the only one a
     no-match can be a fraction of. */
  var fAny = fLooks + fMiss;

  var read;
  if(fLooks >= 5){
    var failPct = Math.round((fNo/fLooks)*100);
    if(failPct >= 50){
      read = '<b>' + failPct + '% of set lookups since the catalog came back still find no '
           + 'match.</b> The sets people own are not the sets it carries \u2014 that is a '
           + 'coverage problem, not an outage.';
    } else if(!fMiss){
      read = '<b>Sets are matching, but nobody opens the missing list.</b> That is the part '
           + 'worth paying for, and it is one tap away from a screen people already reached.';
    } else {
      read = '<b>' + fMiss + ' of ' + fLooks + ' lookups since the renewal reached the missing '
           + 'list.</b> That is the moment worth building around.';
    }
  } else if(fAny){
    read = 'Only <b>' + fAny + '</b> set lookup' + (fAny===1?'':'s') + ' since the catalog '
         + 'came back on 1 Sept \u2014 too few to read a rate from yet. '
         + (fMiss ? '<b>' + fMiss + '</b> of those reached the missing list, which is the part '
                  + 'worth paying for. ' : '')
         + 'The 30-day figures below mostly describe the weeks the subscription was cancelled.';
  } else {
    read = '<b>Nothing has touched the set builder since the catalog was renewed on 1 Sept.</b> '
         + 'Everything in the 30-day numbers happened while the subscription was off and every '
         + 'lookup returned nothing, so none of it describes how well the catalog works now.';
  }

  return '<div class="card"><h2>Set builder \u00b7 30d</h2>'
    + '<div class="funnel">'
      + '<div class="fstep"><div class="fstep-k">Looked up a set size</div>'
        + '<div class="fstep-n">'+num(looks)+'</div><div class="fstep-r">'+num(fAny)+' since fix</div></div>'
      + '<div class="fstep paid"><div class="fstep-k">Opened the missing list</div>'
        + '<div class="fstep-n">'+num(miss)+'</div><div class="fstep-r">'
        + (looks ? Math.round((miss/looks)*100)+'%' : '\u2014')+'</div></div>'
    + '</div>'
    + ((part||nomat) ? '<div class="fnote">'
        + (nomat ? '<b>'+num(nomat)+'</b> sets couldn\'t be matched over 30 days'
                 + (fNo !== nomat ? ' \u2014 <b>'+num(fNo)+'</b> of those since the renewal. ' : '. ') : '')
        + (part  ? '<b>'+num(part)+'</b> checklists were too big to finish in one day.' : '')
        + '</div>' : '')
    + '<div class="fnote">'+read+'</div></div>';
}

/* THE SAVE PANEL WAS COUNTING THE FUNNEL THAT WAS REMOVED.

   bench_save and card_saved are the OLD account-gated events. Since
   the signup wall came out of the save button on 1 Sept the common
   path is card_saved_local / bench_saved_local, which nothing here
   counted -- so this read 0% while saves were happening, and printed
   "people see the offer and decline it" underneath.

   Reads d.trust now, which cg_stats computes from all four save
   events. The account/local split is shown because it is the number
   that actually answers the question: local rising while account
   stays flat is the wall removal working; account rising is people
   choosing to sign up for sync. */
function savePanel(d, t){
  if(!has(t,'save_offers_30d')) return '';
  var tr      = d.trust || {};
  var offers  = Number(t.save_offers_30d||0);
  var benches = Number(t.bench_shown_30d||0);
  var saves   = Number(tr.saves_30d||0);
  var local   = Number(tr.local_30d||0);
  var account = Number(tr.account_30d||0);
  var shown   = offers + benches;

  if(!shown){
    return '<div class="card"><h2>Saving \u00b7 30d</h2>'
      + '<div class="empty">Nothing recorded yet. From here on, a low save count can be read '
      + 'against how many people were actually asked.</div></div>';
  }

  /* OFFERS ARE ONCE-PER-PAGE-LOAD LATCHES, NOT PER-SCAN.

     save_offer_shown and bench_shown each fire once per page load by
     design. Dividing saves by them is not a conversion rate and never
     was -- one visitor scanning eighty cards produces one offer event
     and can produce many saves. The percentage is shown but named for
     what it is, and the reading below leans on the account/local split
     instead, which compares like with like. */
  var pct = shown ? Math.round((saves/shown)*100) : 0;

  var read;
  if(!saves){
    read = '<b>Nobody has kept a card yet.</b> The save path was rebuilt on 1 Sept, so this '
         + 'counts from a standing start rather than describing a long-running failure.';
  } else if(local && !account){
    read = '<b>Every save is a local one \u2014 nobody has signed up to sync them.</b> That is '
         + 'the wall removal working: people keep cards without an account. The open question '
         + 'is whether any of them come back for one.';
  } else if(local > account){
    read = '<b>' + local + ' kept locally, ' + account + ' to an account.</b> Most people are '
         + 'taking the no-signup path, which is what it was built for. Account saves are the '
         + 'ones that survive a cleared browser.';
  } else if(account > local){
    read = '<b>' + account + ' saved to an account against ' + local + ' local.</b> People are '
         + 'choosing to sign up rather than stopping at a device-only save \u2014 worth knowing '
         + 'what they were promised at that moment.';
  } else {
    read = '<b>' + saves + ' cards kept</b>, split evenly between local and account saves.';
  }

  return '<div class="card"><h2>Saving \u00b7 30d</h2>'
    + '<div class="funnel">'
      + '<div class="fstep"><div class="fstep-k">Offered on a single card</div>'
        + '<div class="fstep-n">'+num(offers)+'</div><div class="fstep-r">per load</div></div>'
      + '<div class="fstep"><div class="fstep-k">Saw a bench (2+ cards)</div>'
        + '<div class="fstep-n">'+num(benches)+'</div><div class="fstep-r">per load</div></div>'
      + '<div class="fstep paid"><div class="fstep-k">Kept their cards</div>'
        + '<div class="fstep-n">'+num(saves)+'</div><div class="fstep-r">'+pct+'%</div></div>'
      + '<div class="fstep"><div class="fstep-k">\u2003\u2014 kept on the device</div>'
        + '<div class="fstep-n">'+num(local)+'</div><div class="fstep-r"></div></div>'
      + '<div class="fstep"><div class="fstep-k">\u2003\u2014 saved to an account</div>'
        + '<div class="fstep-n">'+num(account)+'</div><div class="fstep-r"></div></div>'
    + '</div>'
    + '<div class="fnote">'+read+'</div>'
    + '<div class="fnote">The two offer rows fire <b>once per page load</b>, not once per card, '
    + 'so the percentage beside "kept their cards" is not a conversion rate. Read the local vs '
    + 'account split instead.</div>'
    /* THE 30-DAY SPLIT IS MOSTLY THE OLD BEHAVIOUR.

       Saving without an account only became possible on 1 Sept. Before
       that an account was the ONLY way to keep a card, so every save in
       the earlier part of this window is an account save by force, not
       by choice. Reading the 30-day split as a preference gets the
       answer exactly backwards -- which is what it did on 2 Sept,
       printing "people are choosing to sign up" off a window that was
       mostly a signup wall.

       The 7-day panel at the top of the page is the honest one until
       1 Oct, when this window no longer reaches back past the change. */
    + '<div class="fnote bad">\u26a0 This 30-day window straddles <b>1 Sept</b>, when saving '
    + 'without an account became possible at all. Account saves before that date were the only '
    + 'option, not a choice \u2014 so the split above is not a preference. Read the 7-day panel '
    + 'at the top until 1 Oct.</div></div>';
}

/* ── THE ACCOUNT WALL ────────────────────────────────────────────
   Three free scans, then a required free account. Live since 3 Sept
   and the only gate that has ever actually fired -- pro_wall has never
   fired once -- so this is the funnel step worth deciding on, and the
   dashboard could not see it until now.

   THE COST IS THE POINT, NOT A FOOTNOTE. Everyone who hits this wall
   wanted a fourth scan. Whatever fraction does not sign up is scanning
   that no longer happens, and a page reporting only conversions would
   quietly hide that half of the trade.

   Dismissals are counted from 4 Sept onward. Before that, tapping
   THROUGH the wall also logged a dismissal, because the handler closed
   the panel on its way to the signup form -- so every earlier
   dismissal figure is inflated by the people who converted, which is
   exactly backwards. */
function wallPanel(d){
  var f = d.features || {};
  if(!has(f, 'wall_shown_30d')) return '';

  var shown = Number(f.wall_shown_30d||0);
  var tap   = Number(f.wall_clicked_30d||0);
  var sent  = Number(f.wall_code_sent_30d||0);
  var made  = Number(f.wall_verified_30d||0);
  var away  = Number(f.wall_dismissed_30d||0);
  var merges= Number(f.merges_30d||0);
  var nostore = Number(f.no_storage_30d||0);

  if(!shown){
    return '<div class="card"><h2>Account wall \u00b7 since 3 Sept</h2>'
      + '<div class="empty">Nobody has reached a third scan yet. A zero here means the wall '
      + 'has not been tested, not that it works.</div></div>';
  }

  var pct = function(n, of){ return of ? Math.round((n/of)*100)+'%' : '\u2014'; };

  var read;
  if(!made){
    read = '<b>' + shown + ' people hit the wall and none made an account.</b> That is '
         + shown + ' fourth scans that did not happen, bought for nothing. If this holds for '
         + 'a week the wall is costing scans without buying signups.';
  } else if(made/shown >= 0.25){
    read = '<b>' + made + ' of ' + shown + ' turned into accounts.</b> For a hard gate on cold '
         + 'social traffic that is working \u2014 the tool is proving itself in three scans.';
  } else {
    read = '<b>' + made + ' of ' + shown + ' turned into accounts, so roughly '
         + (shown - tap) + ' walked away instead of scanning a fourth card.</b> Whether that '
         + 'trade is worth it depends on what an account is worth to you, which the binder '
         + 'numbers answer and this panel cannot.';
  }

  var storeNote = nostore
    ? '<div class="fnote bad">\u26a0 <b>' + nostore + '</b> sessions had no usable local storage, '
      + 'so the wall never applied to them at all. The counter lives in the same storage it '
      + 'checks, and it fails open on purpose \u2014 blocking a scan over a storage error would '
      + 'be worse. Those sessions are missing from every number above.</div>'
    : '<div class="fnote">The scan counter is per-origin browser storage, so somebody moving '
      + 'between cardgauge.com and scan.cardgauge.com gets three free scans on each. Harmless '
      + 'now; it becomes one number at cutover.</div>';

  return '<div class="card"><h2>Account wall \u00b7 since 3 Sept</h2>'
    + '<div class="funnel">'
      + '<div class="fstep"><div class="fstep-k">Used their three free scans</div>'
        + '<div class="fstep-n">'+num(f.wall_exhausted_30d)+'</div><div class="fstep-r"></div></div>'
      + '<div class="fstep"><div class="fstep-k">Saw the wall</div>'
        + '<div class="fstep-n">'+num(shown)+'</div><div class="fstep-r"></div></div>'
      + '<div class="fstep"><div class="fstep-k">Tapped through to sign up</div>'
        + '<div class="fstep-n">'+num(tap)+'</div><div class="fstep-r">'+pct(tap,shown)+'</div></div>'
      + '<div class="fstep"><div class="fstep-k">Asked for a code</div>'
        + '<div class="fstep-n">'+num(sent)+'</div><div class="fstep-r">'+pct(sent,tap)+'</div></div>'
      + '<div class="fstep paid"><div class="fstep-k">Made an account</div>'
        + '<div class="fstep-n">'+num(made)+'</div><div class="fstep-r">'+pct(made,shown)+'</div></div>'
      + '<div class="fstep'+(away>made?' bad':'')+'"><div class="fstep-k">Closed it and left</div>'
        + '<div class="fstep-n">'+num(away)+'</div><div class="fstep-r">'+pct(away,shown)+'</div></div>'
    + '</div>'
    + '<div class="fnote">'+read+'</div>'
    + '<div class="fnote"><b>'+num(merges)+'</b> device-only collection'+(merges===1?'':'s')
    + ' became an account one. That is the step the whole local-save path exists to reach, and '
    + 'it fired zero times before 2 Sept.</div>'
    + storeNote
    + '<div class="fnote">Dismissals count from <b>4 Sept</b> only. Before that, tapping through '
    + 'the wall also logged a dismissal, so earlier figures counted the people who converted as '
    + 'people who left.</div>'
    + '</div>';
}

/* Refusals: the times CardGauge declined to answer rather than
   guessing. The differentiator, counted -- if this is near zero the
   guards are not firing; if it is most of the traffic the queries are
   too loose upstream and people are meeting a wall of shrugs. */
function refusalPanel(d){
  var f = d.features || {};
  if(!has(f, 'refusals_30d')) return '';
  var r  = Number(f.refusals_30d||0);
  var rv = Number(f.result_viewed_30d||0);
  var op = Number(f.compguard_open_30d||0);
  var pk = Number(f.parallel_picked_30d||0);
  var st = Number(f.serial_typed_30d||0);
  if(!r && !op && !pk && !st) return '';

  var share = rv ? Math.round((r/rv)*100) : 0;
  var read;
  if(!r){
    read = 'Nothing has been refused. Either every pool has been clean, or a guard is not firing.';
  } else if(share >= 40){
    read = '<b>'+share+'% of results refused a grade estimate or a verdict.</b> Honest, but at '
         + 'that rate people are mostly meeting shrugs \u2014 the cause is upstream, in how many '
         + 'cards get identified well enough to find comps.';
  } else {
    read = '<b>'+r+' refusals across '+num(rv)+' results ('+share+'%).</b> The guards fire on the '
         + 'cards that deserve them without swallowing the ordinary ones.';
  }

  return '<div class="card"><h2>When it refused to answer \u00b7 30d</h2>'
    + '<div class="funnel">'
      + '<div class="fstep"><div class="fstep-k">Grade or verdict withheld</div>'
        + '<div class="fstep-n">'+num(r)+'</div><div class="fstep-r">'+share+'%</div></div>'
      + '<div class="fstep"><div class="fstep-k">Opened the CompGuard receipt</div>'
        + '<div class="fstep-n">'+num(op)+'</div><div class="fstep-r"></div></div>'
      + '<div class="fstep"><div class="fstep-k">Corrected the parallel</div>'
        + '<div class="fstep-n">'+num(pk)+'</div><div class="fstep-r"></div></div>'
      + '<div class="fstep"><div class="fstep-k">Typed a serial number</div>'
        + '<div class="fstep-n">'+num(st)+'</div><div class="fstep-r"></div></div>'
    + '</div>'
    + '<div class="fnote">'+read+'</div>'
    + '<div class="fnote">The bottom three are corrections \u2014 somebody telling CardGauge it '
    + 'read their card wrong. Each one is a labelled answer no competitor has.</div></div>';
}

function funnelPanel(d, t){
  if(!has(t,'pro_walls_30d')) return '';

  var views  = Number(t.binder_views_30d||0);
  var walls  = Number(t.pro_walls_30d||0);
  var clicks = Number(t.pro_clicks_30d||0);
  var paid   = Number(t.pro_paid_30d||0);

  if(!views && !walls && !clicks && !paid){
    return '<div class="card"><h2>Pro funnel \u00b7 30d</h2>'
      + '<div class="empty">Nothing recorded yet. Tracking started when this shipped \u2014 '
      + 'from here on, a zero here means nobody reached the wall rather than nobody measured it.</div></div>';
  }

  var pct = function(n, of){ return of ? Math.round((n/of)*100)+'%' : '\u2014'; };
  var rows =
      '<div class="fstep"><div class="fstep-k">Opened their binder</div>'
        +'<div class="fstep-n">'+num(views)+'</div><div class="fstep-r"></div></div>'
    + '<div class="fstep"><div class="fstep-k">Hit the Pro wall</div>'
        +'<div class="fstep-n">'+num(walls)+'</div><div class="fstep-r">'+pct(walls,views)+'</div></div>'
    + '<div class="fstep"><div class="fstep-k">Clicked through to Pro</div>'
        +'<div class="fstep-n">'+num(clicks)+'</div><div class="fstep-r">'+pct(clicks,walls)+'</div></div>'
    + '<div class="fstep paid"><div class="fstep-k">Paid</div>'
        +'<div class="fstep-n">'+num(paid)+'</div><div class="fstep-r">'+pct(paid,clicks)+'</div></div>';

  var by = d.pro_wall_by_source || {};
  var src = Object.keys(by).sort(function(a,b){ return by[b]-by[a]; }).map(function(k){
    return '<div class="fsrc"><span>'+esc(WALL_LABEL[k]||k)+'</span><b>'+num(by[k])+'</b></div>';
  }).join('');

  var fails = Number(t.pro_check_fails_30d||0);
  var note = fails
    ? '<div class="fnote bad">\u26a0 <b>'+fails+' Pro checks failed</b> and fell back to granting '
      + 'access. Pro status is unverifiable while that is happening \u2014 fix it before reading '
      + 'anything above as a conversion rate.</div>'
    : '<div class="fnote">Payment comes from the Stripe webhook, not from a click \u2014 '
      + 'it is the only step here that means money. '
      + (Number(t.pro_cancelled_30d) ? '<b>'+num(t.pro_cancelled_30d)+' cancelled</b> in the same window.' : '')
      + '</div>';

  return '<div class="card"><h2>Pro funnel \u00b7 30d</h2>'
    + '<div class="funnel">' + rows + '</div>'
    + (src ? '<div class="fnote" style="padding-top:12px">Where the wall was hit</div>' + src : '')
    + note + '</div>';
}

function affPanel(d, t){
  if(!has(t,'aff_clicks_30d')) return '';
  var by = d.aff_by_place || {};
  var total = Number(t.aff_clicks_30d || 0);

  if(!total){
    return '<div class="card"><h2>Affiliate clicks \u00b7 30d</h2>'
      + '<div class="empty">Nothing clicked yet. Tracking started when this shipped \u2014 '
      + 'from here on, a missing commission means nobody bought rather than nobody clicked.</div></div>';
  }

  var rows = AFF_ORDER.filter(function(k){ return by[k]; }).map(function(k){
    return '<div class="aff-row'+(k==='own_store'?' own':'')+'"><span>'
      + esc(AFF_LABEL[k]||k) + '</span><b>' + num(by[k]) + '</b></div>';
  }).join('');

  Object.keys(by).forEach(function(k){
    if(AFF_ORDER.indexOf(k) === -1)
      rows += '<div class="aff-row"><span>'+esc(k)+'</span><b>'+num(by[k])+'</b></div>';
  });

  var own = Number(t.own_store_clicks_7d || 0);
  return '<div class="card"><h2>Affiliate clicks \u00b7 30d</h2>'
    + '<div class="aff">' + rows + '</div>'
    + '<div class="aff-note">Clicks, not sales \u2014 whether any became a purchase only shows '
    + 'in eBay Partner Network and Amazon Associates. '
    + (own ? '<b>' + own + ' of this week\'s went to your own store</b>, where EPN also credits '
           + 'the final value fee on anything that sells.'
          : 'Clicks to <b>your own store</b> are worth more than the rest \u2014 EPN credits the '
           + 'final value fee on those sales too.')
    + '</div></div>';
}

/* Outreach email opens. New tonight, kept in the same "say what the
   data actually is" spirit as everything else here: a real, honest
   lower bound, not a claimed exact count -- many mail clients block
   remote images by default, so an email genuinely read can still show
   as unopened here. Said directly rather than left for someone to
   assume this is precise. */
function emailOpensPanel(d, t){
  var eo = d.email_opens;
  if(!eo) return '';
  var sent = Number(eo.sent_30d||0);
  var opened = Number(eo.opened_30d||0);
  var recent = eo.recent || [];

  if(!sent){
    return '<div class="card"><h2>Outreach email opens \u00b7 30d</h2>'
      + '<div class="empty">Nothing tracked yet. Only emails sent WITH the tracking pixel '
      + 'embedded show up here \u2014 plain-text emails sent before this shipped can\'t be '
      + 'tracked retroactively.</div></div>';
  }

  var pct = sent ? Math.round((opened/sent)*100) : 0;
  var rows = recent.map(function(r){
    var when = String(r.sent_at||'').slice(0,10);
    return '<div class="eo-row"><span class="eo-recipient">' + esc(r.recipient)
      + (r.campaign ? '<span class="how"> ' + esc(r.campaign) + '</span>' : '')
      + '</span><span class="eo-status ' + (r.opened?'opened':'unopened') + '">'
      + (r.opened ? '\u2713 opened' : 'sent ' + esc(when))
      + '</span></div>';
  }).join('');

  return '<div class="card"><h2>Outreach email opens \u00b7 30d</h2>'
    + '<div class="funnel">'
      + '<div class="fstep"><div class="fstep-k">Sent</div>'
        + '<div class="fstep-n">'+num(sent)+'</div><div class="fstep-r"></div></div>'
      + '<div class="fstep paid"><div class="fstep-k">Opened (at least once)</div>'
        + '<div class="fstep-n">'+num(opened)+'</div><div class="fstep-r">'+pct+'%</div></div>'
    + '</div>'
    + (rows ? '<div class="subhead">Recent sends</div>' + rows : '')
    + '<div class="fnote">A real lower bound, not an exact count \u2014 many mail clients block '
    + 'remote images by default, so a genuinely-read email can still show as unopened here.</div>'
    + '</div>';
}

function cell(label, n, sub){
  return '<div class="cell"><div class="cell-lbl">' + esc(label) + '</div>'
    + '<div class="cell-n">' + n + '</div>'
    + '<div class="cell-sub">' + esc(sub) + '</div></div>';
}

load();
</script>
</body>
</html>
